<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#071413" />
    <title>Page not found | Rijian Song</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #071413;
        color: #f2f7f5;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 15%, rgba(213, 255, 69, 0.12), transparent 35rem),
          #071413;
      }
      main { width: min(42rem, 100%); }
      .mark {
        display: inline-grid;
        width: 3rem;
        height: 3rem;
        place-items: center;
        border: 1px solid #d5ff45;
        border-radius: 50%;
        color: #d5ff45;
        font-weight: 700;
      }
      p { color: #a9bbb7; line-height: 1.7; }
      .code { margin: 3rem 0 0.5rem; color: #d5ff45; letter-spacing: 0.18em; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: 1; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        color: #071413;
        background: #d5ff45;
        padding: 0.85rem 1.15rem;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #f2f7f5; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-label="Rijian Song">RS</span>
      <p class="code">404</p>
      <h1>Page not found.</h1>
      <p>The page may have moved or the address may be incomplete. Return to Rijian Song’s homepage to continue.</p>
      <a href="/">Back to homepage →</a>
    </main>
  </body>
</html>
