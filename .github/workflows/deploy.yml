name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # Previously deployed revision
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm run build:purge
      - name: Build approved visual baseline
        env:
          JEKYLL_ENV: production
        run: |
          baseline="$RUNNER_TEMP/rijian-site-baseline"
          git fetch origin c6af2b3005300cab65357cfdcd420e48d6594b9b
          mkdir -p "$baseline"
          git archive c6af2b3005300cab65357cfdcd420e48d6594b9b | tar -x -C "$baseline"
          (cd "$baseline" && BUNDLE_PATH="$GITHUB_WORKSPACE/vendor/bundle" BUNDLE_GEMFILE="$baseline/Gemfile" bundle exec jekyll build && node "$GITHUB_WORKSPACE/node_modules/purgecss/bin/purgecss.js" -c purgecss.config.js)
          echo "BASELINE_DIR=$baseline/_site" >> "$GITHUB_ENV"
      - name: Validate site contract and visual parity
        run: |
          npm run lint:style-contract
          npx playwright install --with-deps chromium webkit
          npm run test:visual
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: output/playwright/report
          if-no-files-found: ignore
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
